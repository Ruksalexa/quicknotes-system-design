<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>QuickNotes API Client</title>
    <script src="api.js" defer></script>
</head>

<body>
    <header>
        <h1>QuickNotes API Client</h1>
        <p>Talking to a real API</p>
    </header>

    <main>
        <section>
            <h2>Load notes</h2>
            <button id="load-btn">Load notes</button>
            <p id="status"></p>
        </section>

        <section>
            <h2>Add a note</h2>
            <form id="note-form">
                <p>
                    <label for="title-input">Title</label>
                    <input type="text" id="title-input" placeholder="Note title">
                </p>
                <p>
                    <label for="body-input">Body</label>
                    <textarea id="body-input" rows="4" placeholder="Note body (optional)"></textarea>
                </p>
                <button type="submit" id="submit-btn">Add note</button>
            </form>
        </section>

        <section>
            <h2>Notes</h2>
            <ul id="notes-list"></ul>
        </section>
    </main>
</body>

</html>
